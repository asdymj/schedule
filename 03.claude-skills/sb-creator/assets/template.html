<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- PROJECT_NAME --> - Screen Design Document</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css'); }
  * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; box-sizing: border-box; }
  body { background: #f8f9fa; margin: 0; }

  /* === TAB NAVIGATION === */
  .tab-btn { transition: all 0.15s; background: #fff; border: none; cursor: pointer; }
  .tab-btn:hover { background: #e9ecef; }
  .tab-btn.active { background: #343a40; color: #fff; }

  /* === SCREEN SECTIONS === */
  .screen-section { scroll-margin-top: 48px; position: relative; z-index: 1; }

  /* === SIDEBAR === */
  .sidebar-item { padding: 10px 20px; color: #adb5bd; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 10px; border-radius: 6px; margin: 2px 8px; transition: all 0.15s; }
  .sidebar-item:hover { background: rgba(255,255,255,0.08); color: #dee2e6; }
  .sidebar-item.active { background: rgba(255,255,255,0.15); color: #fff; font-weight: 600; }
  .sidebar-sub { padding-left: 44px; font-size: 12px; }

  /* === STAT CARDS === */
  .stat-card { background: #fff; border-radius: 10px; padding: 20px; border: 1px solid #dee2e6; }
  .stat-value { font-size: 28px; font-weight: 700; color: #212529; }
  .stat-label { font-size: 12px; color: #6c757d; margin-bottom: 4px; }
  .stat-change { font-size: 12px; font-weight: 500; }
  .stat-up { color: #495057; }
  .stat-up::before { content: "▲ "; font-size: 10px; }
  .stat-down { color: #6c757d; }
  .stat-down::before { content: "▼ "; font-size: 10px; }

  /* === BADGES (all grayscale) === */
  .badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
  .badge-dark { background: #343a40; color: #fff; }
  .badge-mid { background: #6c757d; color: #fff; }
  .badge-light { background: #e9ecef; color: #495057; }
  .badge-outline { background: #fff; color: #495057; border: 1px solid #ced4da; }
  .badge-pending { background: #e9ecef; color: #495057; border: 1px solid #ced4da; }
  .badge-approved { background: #dee2e6; color: #212529; }
  .badge-rejected { background: #495057; color: #fff; }
  .badge-active { background: #343a40; color: #fff; }

  /* === TABLES === */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #e9ecef; text-align: left; padding: 10px 12px; font-weight: 600; color: #495057; border-bottom: 2px solid #dee2e6; font-size: 12px; }
  td { padding: 10px 12px; border-bottom: 1px solid #e9ecef; color: #343a40; }
  tr:hover td { background: #f8f9fa; }

  /* === BUTTONS === */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
  .btn-dark { background: #495057; color: #fff; }
  .btn-dark:hover { background: #343a40; }
  .btn-outline { background: #fff; color: #495057; border: 1px solid #ced4da; }
  .btn-outline:hover { background: #f8f9fa; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  /* === CARDS === */
  .card { background: #fff; border-radius: 10px; border: 1px solid #dee2e6; overflow: visible; }
  .card-header { padding: 16px 20px; border-bottom: 1px solid #e9ecef; font-weight: 600; font-size: 15px; color: #212529; }
  .card-body { padding: 20px; }

  /* === TOGGLE === */
  .toggle { width: 40px; height: 22px; border-radius: 11px; position: relative; cursor: pointer; transition: all 0.2s; }
  .toggle.on { background: #495057; }
  .toggle.off { background: #ced4da; }
  .toggle::after { content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #fff; top: 2px; transition: all 0.2s; }
  .toggle.on::after { left: 20px; }
  .toggle.off::after { left: 2px; }

  /* === INPUTS === */
  .input { padding: 8px 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 13px; outline: none; width: 100%; }
  .input:focus { border-color: #495057; box-shadow: 0 0 0 3px rgba(73,80,87,0.1); }
  .select { padding: 8px 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 13px; background: #fff; outline: none; cursor: pointer; appearance: auto; }

  /* === GAUGE === */
  .gauge-ring { stroke-linecap: round; transition: stroke-dashoffset 0.5s; }

  /* === META BOX === */
  .screen-id-badge { display: inline-flex; align-items: center; padding: 3px 12px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 6px; font-size: 12px; font-weight: 600; color: #495057; margin-right: 8px; }
  .breadcrumb { font-size: 12px; color: #adb5bd; }
  .breadcrumb a { color: #6c757d; text-decoration: none; }
  .meta-box { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; }
  .meta-box .meta-label { font-size: 11px; color: #adb5bd; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .meta-box .meta-value { font-size: 13px; color: #343a40; margin-top: 2px; }

  /* === NUMBERED INDICATORS === */
  .indicator { position: absolute; z-index: 9999; width: 22px; height: 22px; border-radius: 50%; background: #e67700; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; line-height: 1; box-shadow: 0 2px 6px rgba(230,119,0,0.35); }
  .ind-container { position: relative; overflow: visible !important; }

  /* === DESCRIPTION TABLE === */
  .desc-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 0; }
  .desc-table th { background: #343a40; color: #fff; padding: 8px 10px; text-align: left; font-size: 11px; border: 1px solid #343a40; }
  .desc-table td { padding: 8px 10px; border: 1px solid #dee2e6; color: #343a40; vertical-align: top; line-height: 1.5; }
  .desc-table tr:nth-child(even) td { background: #f8f9fa; }
  .desc-table .num { font-weight: 700; text-align: center; width: 1%; white-space: nowrap; color: #e67700; }
  .desc-table th:last-child, .desc-table td:last-child { width: 240px; min-width: 240px; }

  /* === RIGHT PANEL LAYOUT === */
  .screen-section:not(#cover-page) { display: grid; grid-template-columns: 1fr 400px; grid-template-rows: auto 1fr; }
  .screen-section:not(#cover-page) .meta-box { grid-column: 1 / -1; }
  .screen-section:not(#cover-page) .wireframe-wrap { grid-column: 1; grid-row: 2; }
  .screen-section:not(#cover-page) .desc-wrap { grid-column: 2; grid-row: 2; position: sticky; top: 52px; max-height: calc(100vh - 60px); overflow-y: auto; margin: 0 !important; padding: 16px; border-left: 2px solid #dee2e6; background: #fff; align-self: start; }
  .desc-wrap h3 { font-size: 14px !important; margin: 0 0 10px 0 !important; }

  /* === DOWNLOAD BUTTONS === */
  /* PDF only. Editable PPTX is injected by sb-creator-pptx (separate skill). */
  .download-btns { position: absolute; top: 60px; right: 32px; display: flex; gap: 8px; z-index: 10; }
  .download-btns button { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #ced4da; padding: 6px 16px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .download-btns button:hover { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.3); }

  /* === PRINT === */
  @media print {
    @page { size: landscape; margin: 8mm; }
    .no-print, .download-btns { display: none !important; }
    body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .screen-section { page-break-before: always; position: static !important; z-index: auto !important; scroll-margin-top: 0 !important; }
    .screen-section:not(#cover-page) { display: grid !important; grid-template-columns: 1fr 360px !important; }
    .desc-wrap { position: static !important; max-height: none !important; overflow: visible !important; }
    .wireframe-wrap { overflow: hidden !important; }
    .meta-box { margin: 0 24px !important; }
  }
</style>
</head>

<!-- ==================== JAVASCRIPT ==================== -->
<script>
function showScreen(screenId, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const target = document.getElementById(screenId);
  if (target) {
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function initSidebars() {
  const template = document.getElementById('sidebar-template');
  if (!template) return;
  document.querySelectorAll('.admin-sidebar').forEach(placeholder => {
    const clone = template.content.cloneNode(true);
    const activeScreen = placeholder.getAttribute('data-active');
    clone.querySelectorAll('.sidebar-item').forEach(item => {
      if (item.getAttribute('data-screen') === activeScreen) {
        item.classList.add('active');
      }
      item.addEventListener('click', () => {
        const targetScreen = item.getAttribute('data-screen');
        if (targetScreen) {
          document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.textContent.includes(targetScreen.replace('scr-', ''))) {
              showScreen(targetScreen, btn);
            }
          });
        }
      });
    });
    placeholder.appendChild(clone);
  });
}

document.getElementById('cover-page').addEventListener('click', (e) => {
  if (!e.target.closest('button') && !e.target.closest('.download-btns')) {
    showScreen('scr-001', document.querySelectorAll('.tab-btn')[1]);
  }
});

// Scroll spy: update active tab based on scroll position
function updateActiveTab() {
  const sections = document.querySelectorAll('.screen-section');
  const tabs = document.querySelectorAll('.tab-btn');
  let current = 0;
  sections.forEach((section, idx) => {
    const rect = section.getBoundingClientRect();
    if (rect.top <= 80) current = idx;
  });
  tabs.forEach(t => t.classList.remove('active'));
  if (tabs[current]) tabs[current].classList.add('active');
}

// --- PDF download (window.print). Editable PPTX is added by sb-creator-pptx. ---
function downloadPDF(e) {
  e.stopPropagation();
  window.print();
}

document.addEventListener('DOMContentLoaded', () => {
  initSidebars();
  document.getElementById('cover-page').style.cursor = 'pointer';
  window.addEventListener('scroll', updateActiveTab, { passive: true });
});
</script>
